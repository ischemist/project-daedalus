name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  code-quality:
    name: Lint, Format, Type Check & Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daedalus?schema=public
      BETTER_AUTH_SECRET: ci-better-auth-secret-01234567890123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: generate prisma client
        run: pnpm db:generate

      - name: format check
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: type check
        run: pnpm check-types

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build
