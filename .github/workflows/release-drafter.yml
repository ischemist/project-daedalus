name: Label PR & Draft Release

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  process-pr:
    permissions:
      contents: write
      pull-requests: write
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: assign labels from commits
        if: github.event_name == 'pull_request'
        id: assign-labels
        uses: mauroalderete/action-assign-labels@671a4ca2da0f900464c58b8b5540a1e07133e915 # v1
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          conventional-commits: |
            conventional-commits:
              - type: 'feat'
                nouns: ['FEATURE', 'Feature', 'feature', 'FEAT', 'Feat', 'feat']
                labels: ['type/feature']
              - type: 'fix'
                nouns: ['FIX', 'Fix', 'fix', 'FIXED', 'Fixed', 'fixed']
                labels: ['type/bug']
              - type: 'refactor'
                nouns: ['REFACTOR', 'Refactor', 'refactor', 'REF', 'Ref', 'ref']
                labels: ['type/refactor']
              - type: 'perf'
                nouns: ['PERF', 'Perf', 'perf', 'PERFORMANCE', 'Performance', 'performance']
                labels: ['scope/performance']
              - type: 'docs'
                nouns: ['DOCS', 'Docs', 'docs', 'DOC', 'Doc', 'doc']
                labels: ['type/docs']
              - type: 'test'
                nouns: ['TEST', 'Test', 'test', 'TESTS', 'Tests', 'tests']
                labels: ['scope/testing']
              - type: 'chore'
                nouns: ['CHORE', 'Chore', 'chore']
                labels: ['type/chore']
              - type: 'ci'
                nouns: ['CI', 'Ci', 'ci']
                labels: ['scope/ci-cd']
          maintain-labels-not-matched: false
          apply-changes: true

      - uses: release-drafter/release-drafter@3f0f87098bd6b5c5b9a36d49c41d998ea58f9348 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
