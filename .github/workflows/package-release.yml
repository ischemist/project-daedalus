name: Package Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or Publish Packages
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/daedalus?schema=public
      BETTER_AUTH_SECRET: ci-better-auth-secret-01234567890123456789
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: install
        run: pnpm install --frozen-lockfile

      - name: generate prisma client
        run: pnpm db:generate

      - name: format check
        run: pnpm format:check

      - name: lint
        run: pnpm lint

      - name: type check
        run: pnpm check-types

      - name: build
        run: pnpm build

      - name: create version PR or publish packages
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "version packages"
          commit: "version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
