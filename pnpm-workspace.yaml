packages:
  - apps/*
  - packages/*

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# pnpm v11 requires explicit allowlisting for packages that install native binaries.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  lefthook: true
  msw: false
  prisma: true
  sharp: true
